name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 전체 테스트가 API 키·네트워크 없이 실행된다 (MockLLM 설계 덕분)
      - run: python -m pytest tests/ -v
